/**
 * Android Gradle Build Configuration
 *
 * This file defines the build configuration for the Android application,
 * including build variants (debug/release), signing configurations,
 * dependencies, and build parameters.
 *
 * Requirements: 1.4, 1.5, 1.6, 4.2, 4.5
 */

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    namespace "com.propertyark.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.realestate.marketplace"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    /**
     * Signing configurations for debug and release builds
     * Debug signing uses default Android debug keystore
     * Release signing uses production keystore (configured via environment variables)
     */
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            // Release keystore path and credentials are loaded from environment variables
            // Set via: ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("ANDROID_KEY_ALIAS")
            def keyPassword = System.getenv("ANDROID_KEY_PASSWORD")

            if (keystorePath && keystorePassword && keyAlias && keyPassword) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    /**
     * Build types define how the app is compiled
     * Debug: Includes debugging symbols, not optimized
     * Release: Optimized, minified, and signed with release keystore
     */
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    /**
     * Build variants allow different configurations for different builds
     * Flavor dimensions can be used to create multiple variants
     */
    flavorDimensions "environment"

    productFlavors {
        development {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }

        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
        }

        production {
            dimension "environment"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        compose false
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

/**
 * Dependencies for the Android application
 * Includes AndroidX and other required libraries
 */
dependencies {
    // Capacitor core
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'

    // Material Design
    implementation 'com.google.android.material:material:1.9.0'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.1.0'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

/**
 * Gradle task to verify build configuration
 * Validates that all required properties are set correctly
 */
task verifyBuildConfig {
    doLast {
        println "Build Configuration Verification:"
        println "  Application ID: ${android.defaultConfig.applicationId}"
        println "  Version Code: ${android.defaultConfig.versionCode}"
        println "  Version Name: ${android.defaultConfig.versionName}"
        println "  Min SDK: ${android.defaultConfig.minSdk}"
        println "  Target SDK: ${android.defaultConfig.targetSdk}"
        println "  Compile SDK: ${android.compileSdk}"
        println "  Build Variants: ${android.productFlavors.collect { it.name }.join(', ')}"
        println "  Signing Configs: ${android.signingConfigs.collect { it.name }.join(', ')}"
    }
}

// Run verification task before build
preBuild.dependsOn verifyBuildConfig
