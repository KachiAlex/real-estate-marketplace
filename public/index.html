<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    
    <!-- Viewport configuration for mobile devices with notch support -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    
    <!-- Mobile app configuration -->
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PropertyArk" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    
    <!-- Safe area and compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Description -->
    <meta
      name="description"
      content="PropertyArk - Buy, sell, rent, and invest in properties with secure escrow services"
    />
    
    <!-- Icons and manifest -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Preconnect to Google Maps for faster loading -->
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://maps.googleapis.com">
    
    <title>PropertyArk</title>
    
    <!-- Paystack inline SDK (used for client-side popup checkout) -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
  </head>
  <body>
    <noscript>
      <div style="font-family: 'Inter', Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 40px 20px; color: #1e293b;">
        <h1 style="font-size: 2.5rem; color: #f97316; margin-bottom: 8px;">PropertyArk</h1>
        <p style="font-size: 1.25rem; color: #64748b; margin-bottom: 32px;">Buy, sell, rent, and invest in properties with secure escrow services in Nigeria.</p>

        <h2 style="font-size: 1.5rem; margin-bottom: 16px;">About PropertyArk</h2>
        <p style="font-size: 1.05rem; line-height: 1.7; margin-bottom: 24px;">
          PropertyArk is a real estate marketplace platform that enables users to browse, list, and transact properties across Nigeria.
          Our platform provides secure escrow services for property transactions, investment opportunities in real estate,
          mortgage facilitation, and professional property services. Users can search for properties by location, type, and price,
          connect with verified vendors, and complete transactions with confidence through our escrow protection.
        </p>

        <h2 style="font-size: 1.5rem; margin-bottom: 16px;">Key Features</h2>
        <ul style="font-size: 1.05rem; line-height: 1.8; margin-bottom: 24px; padding-left: 20px;">
          <li>Browse thousands of property listings across Nigeria</li>
          <li>Secure escrow services for safe property transactions</li>
          <li>Real estate investment opportunities with verified returns</li>
          <li>Mortgage facilitation and application management</li>
          <li>Direct messaging with property vendors and agents</li>
          <li>Property verification and KYC for trusted transactions</li>
        </ul>

        <h2 style="font-size: 1.5rem; margin-bottom: 16px;">Get Started</h2>
        <p style="font-size: 1.05rem; line-height: 1.7; margin-bottom: 16px;">
          You can browse properties without an account. To list properties, make inquiries, or use escrow services,
          please sign in or create a free account.
        </p>
        <p style="margin-bottom: 32px;">
          <a href="/auth/login" style="display: inline-block; background: #f97316; color: #fff; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; margin-right: 12px;">Sign In</a>
          <a href="/auth/register" style="display: inline-block; border: 2px solid #f97316; color: #f97316; padding: 10px 26px; border-radius: 8px; text-decoration: none; font-weight: 600;">Create Account</a>
        </p>

        <h2 style="font-size: 1.5rem; margin-bottom: 16px;">Legal</h2>
        <p style="font-size: 1.05rem;">
          <a href="/privacy-policy" style="color: #f97316;">Privacy Policy</a> &middot;
          <a href="/terms-of-service" style="color: #f97316;">Terms of Service</a>
        </p>

        <p style="margin-top: 40px; color: #94a3b8; font-size: 0.9rem;">
          PropertyArk &middot; <a href="mailto:support@propertyark.africa" style="color: #f97316;">support@propertyark.africa</a>
        </p>
      </div>
    </noscript>
    <div id="root">
      <!-- Branded splash screen — replaced by React once mounted -->
      <div id="app-splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;font-family:'Inter',Arial,sans-serif;">
        <img src="/logo.png" alt="PropertyArk" style="width:72px;height:72px;margin-bottom:20px;animation:splash-pulse 1.4s ease-in-out infinite;" onerror="this.style.display='none'"/>
        <h1 style="font-size:1.75rem;font-weight:700;color:#f97316;margin:0 0 14px 0;letter-spacing:-0.02em;">PropertyArk</h1>
        <div style="width:36px;height:36px;border:3px solid rgba(249,115,22,0.2);border-top-color:#f97316;border-radius:50%;animation:splash-spin 0.8s linear infinite;"></div>
        <p style="margin-top:16px;font-size:0.85rem;color:#94a3b8;">Loading secure properties…</p>
      </div>
      <style>
        @keyframes splash-spin { to { transform: rotate(360deg); } }
        @keyframes splash-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.92); } }
      </style>
    </div>
  </body>
</html>
